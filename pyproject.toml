[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-smart-retry"
version = "0.1.0"
description = "Pytest plugin for automatic test retry with Selenium driver reset"
requires-python = ">=3.9"
dependencies = ["pytest>=7"]

[project.optional-dependencies]
ai = ["openai", "requests"]
slack = ["requests"]

[project.entry-points."pytest11"]
smart_retry = "pytest_smart_retry.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_smart_retry*"]
